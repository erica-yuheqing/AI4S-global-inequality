[project]
name = "AI4S-Research"
version = "0.1.0"
description = "Artificial intelligence for science reinforces inequalities in global knowledge production: evidence from AlphaFold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bokeh>=3.9.0",
    "geographiclib>=2.1",
    "geopandas>=1.1.3",
    "grandalf>=0.8",
    "httpx[socks]>=0.28.1",
    "marimo[recommended]>=0.20.4",
    # "markitdown[docx,pdf,pptx]>=0.0.2",
    "mne-connectivity>=0.7.0",
    "netgraph>=4.13.2",
    "networkx[default]>=3.6.1",
    "openchord>=0.1.7",
    "openpyxl>=3.1.5",
    "plotapi>=8.0.0",
    "plotly>=6.6.0",
    "pyecharts>=2.1.0",
    "pyogrio>=0.12.1",
    "pypalettes>=0.2.1",
    "pyproj>=3.7.2",
    "rectangle-packer>=2.1.0",
    "requests>=2.32.5",
    "seaborn>=0.13.2",
    "sentencepiece>=0.2.1",
    "shapely>=2.1.2",
    "squarify>=0.4.4",
    # "torch>=2.10.0",
    "tqdm>=4.67.3",
    # "transformers>=5.3.0",
    "websockets>=16.0",
]

[tool.marimo.runtime]
output_max_bytes = 20_000_000
